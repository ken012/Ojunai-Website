[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Pretty 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers live in public/_headers so drag-and-drop deploys of dist/
# get them too (manual deploys ignore this file).
