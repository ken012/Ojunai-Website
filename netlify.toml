[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Pretty 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers. Deliberately conservative: none of these restrict what the
# page may load, so they cannot break rendering. A full Content-Security-Policy
# is a separate piece of work that needs per-page testing.
#
# HSTS is set WITHOUT includeSubDomains on purpose — this is the apex domain,
# and includeSubDomains would bind app., api., voice. and every future
# subdomain to HTTPS-only for a year.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
